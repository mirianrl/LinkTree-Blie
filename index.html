<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Blie Hotéis - Bonito, Mato Grosso do Sul"
    >

    <title>Blie Hotéis | Bonito - MS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Sacramento&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-links">

        <section class="linktree">

            <!-- =========================
                 HERO / FOTO DO HOTEL
            ========================== -->
            <div class="hero">

                <div class="hero-overlay"></div>

                <!-- Idiomas -->
                <div class="idiomas">
                    <button class="idioma ativo" data-lang="pt">
                        PT
                    </button>

                    <span></span>

                    <button class="idioma" data-lang="en">
                         EN
                    </button>

                    <span></span>

                    <button class="idioma" data-lang="es">
                        ES
                    </button>
                </div>

            </div>


            <!-- =========================
                 CONTEÚDO PRINCIPAL
            ========================== -->
            <div class="conteudo">

                <!-- Logo -->
                <div class="logo-wrapper">

                    <div class="logo">
                        <span>B</span>
                    </div>

                </div>


                <!-- Nome -->
                <div class="marca">

                    <h1>
                        BLIE HOTÉIS
                    </h1>

                    <p class="localizacao-titulo">
                        BONITO <span>•</span> MS
                    </p>

                </div>


                <!-- Detalhe -->
                <div class="detalhe">

                    <span class="linha"></span>

                    <i class="fa-solid fa-leaf"></i>

                    <span class="linha"></span>

                </div>


                <!-- Frase -->
                <p
                    class="descricao"
                    data-pt="Sua melhor experiência em Bonito começa aqui."
                    data-en="Your best experience in Bonito starts here."
                    data-es="Tu mejor experiencia en Bonito comienza aquí."
                >
                    Sua melhor experiência em Bonito começa aqui.
                </p>


                <!-- =========================
                     LINKS
                ========================== -->
                <div class="links">


                    <!-- RESERVA -->
                    <a
                        href="https://hotels.cloudbeds.com/pt-br/reservas/p98p7k?promo=OfertaPix15&currency=brl"
                        class="link-card link-destaque"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                    <div class="icone">
                        <i class="fa-regular fa-calendar-check"></i>
                    </div>

                    <span
                        data-pt="Reserve sua hospedagem"
                        data-en="Book your stay"
                        data-es="Reserva tu estadía"
                    >
                        Reserve sua hospedagem
                    </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- WHATSAPP -->
                    <a
                        href="https://wa.me/556720360011"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="icone whatsapp">

                            <i class="fa-brands fa-whatsapp"></i>

                        </div>

                        <span
                            data-pt="Fale conosco no WhatsApp"
                            data-en="Contact us on WhatsApp"
                            data-es="Habla con nosotros por WhatsApp"
                        >
                            Fale conosco no WhatsApp
                        </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- ACOMODAÇÕES -->
                    <a
                        href="https://bliehoteis.com.br/quartos"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                    <div class="icone">
                        <i class="fa-solid fa-bed"></i>
                    </div>

                    <span
                        data-pt="Conheça nossas acomodações"
                        data-en="Discover our rooms"
                        data-es="Conoce nuestras habitaciones"
                    >
                        Conheça nossas acomodações
                    </span>

                    <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- CAFÉ DA MANHÃ -->
                    <a
                        href="https://bliehoteis.com.br/cafe-da-manha"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                    <div class="icone">
                        <i class="fa-solid fa-mug-hot"></i>
                    </div>

                    <span
                        data-pt="Conheça nosso café da manhã"
                        data-en="Discover our breakfast"
                        data-es="Conoce nuestro desayuno"
                    >
                        Conheça nosso café da manhã
                    </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- PASSEIOS -->
                    <a
                        href="https://bliehoteis.com.br/destino-bonito"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                    <div class="icone">
                        <i class="fa-regular fa-camera"></i>
                    </div>

                    <span
                        data-pt="Passeios em Bonito"
                        data-en="Tours in Bonito"
                        data-es="Tours en Bonito"
                    >
                        Passeios em Bonito
                    </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- COMO CHEGAR -->
                    <a
                        href="https://bliehoteis.com.br/contato"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                    <div class="icone localizacao">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <span
                        data-pt="Como chegar"
                        data-en="How to get here"
                        data-es="Cómo llegar"
                    >
                        Como chegar
                    </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- SITE OFICIAL -->
                    <a
                        href="https://bliehoteis.com.br/"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="icone">

                            <i class="fa-solid fa-globe"></i>

                        </div>

                        <span
                            data-pt="Site oficial"
                            data-en="Official website"
                            data-es="Sitio oficial"
                        >
                            Site oficial
                        </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>


                    <!-- INSTAGRAM -->
                    <a
                        href="https://www.instagram.com/bliehoteisbonitoms/"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="icone instagram">

                            <i class="fa-brands fa-instagram"></i>

                        </div>

                        <span>
                            Instagram
                        </span>

                        <i class="fa-solid fa-chevron-right seta"></i>

                    </a>

                </div>

            </div>


            <!-- =========================
                 RODAPÉ
            ========================== -->
            <footer class="footer">

                <div class="onda onda-1"></div>

                <div class="onda onda-2"></div>


                <div class="footer-conteudo">

                    <p
                        data-pt="Viva Bonito."
                        data-en="Experience Bonito."
                        data-es="Vive Bonito."
                    >
                        Viva Bonito.
                    </p>

                    <i class="fa-solid fa-leaf"></i>

                </div>

            </footer>

        </section>

    </main>


    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
